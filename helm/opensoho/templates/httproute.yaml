{{- if .Values.httproute.enabled -}}
{{- $fullName := include "opensoho.fullname" . -}}
{{- $svcPort := .Values.service.port -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
spec:
  hostnames:
  - {{ .Values.httproute.hostname | quote }}

  parentRefs:
{{ .Values.httproute.parentRefs | toYaml | indent 2 }}

  rules:
  - matches:
    - path:
      type: PathPrefix
      value: /
    backendRefs:
    - name: {{ $fullName }}
      port: {{ $svcPort }}
{{- end }}
